# Checks on every push and pull request: type-check, production dependency audit, and the daemon smoke test
# (a throwaway daemon with shell sessions; no AI calls, no secrets needed).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022 # Visual Studio 2022: npm's node-gyp 9 cannot find the VS 2026 on windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5 # node-gyp (native modules)
        with:
          python-version: '3.12'
      # each step goes through ci-step.sh so a failure shows its error lines on the run's summary page
      - run: bash .github/ci-step.sh "npm ci" npm ci
        shell: bash
      - run: bash .github/ci-step.sh "typecheck" npm run typecheck
        shell: bash
      - run: bash .github/ci-step.sh "npm audit" npm audit --omit=dev --audit-level=high
        shell: bash
      - run: bash .github/ci-step.sh "smoke test" npm run smoke
        shell: bash

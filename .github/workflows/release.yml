# Release builds: push a tag like v0.2.0 and the Windows installer / portable exe and the macOS dmg / zip (Apple
# Silicon and Intel) are built on GitHub's runners and attached to a draft GitHub Release.
# Native modules (node-pty, better-sqlite3) are compiled on each OS, which is why every platform builds on its own.
#
# Unsigned for now. To sign later, add repository secrets and drop CSC_IDENTITY_AUTO_DISCOVERY:
#   Windows: CSC_LINK (base64 .pfx), CSC_KEY_PASSWORD
#   macOS:   CSC_LINK (base64 .p12), CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022 # Visual Studio 2022 (node-gyp 9 does not know the VS 2026 on windows-latest)
            target: --win
          - os: macos-latest # Apple Silicon (macos-14 failed with "configuration not supported")
            target: --mac --arm64
          - os: macos-15-intel # Intel (macos-13 runners are retired)
            target: --mac --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5 # node-gyp (native modules)
        with:
          python-version: '3.11' # node-gyp 9 needs distutils, which Python 3.12 removed
      # --ignore-scripts: npm would compile better-sqlite3 and node-pty for plain Node with its own node-gyp 9, which
      # fails on the runners' newer Visual Studio and is not needed. The Electron builds come from install-app-deps.
      - run: bash .github/ci-step.sh "npm ci" npm ci --ignore-scripts
        shell: bash
      - run: bash .github/ci-step.sh "native modules for Electron" npx electron-builder install-app-deps
        shell: bash
      - run: bash .github/ci-step.sh "typecheck" npm run typecheck
        shell: bash
      - run: bash .github/ci-step.sh "vite build" npx electron-vite build
        shell: bash
      - run: bash .github/ci-step.sh "electron-builder" npx electron-builder ${{ matrix.target }} --publish never
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: agento-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
